plugins {
    alias(libs.plugins.android.application)
}

def localPropertiesFile = rootProject.file("local.properties")
def placesApiKey = ""
if (localPropertiesFile.exists()) {
    localPropertiesFile.eachLine { line ->
        if (line.startsWith("PLACES_API_KEY=")) {
            placesApiKey = line.substring("PLACES_API_KEY=".length()).trim()
        }
    }
}

android {
    namespace 'com.kcorteel.travel_esteban_kylian'
    compileSdk 35

    defaultConfig {
        applicationId "com.kcorteel.travel_esteban_kylian"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "PLACES_API_KEY", "\"${placesApiKey}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation "com.google.android.libraries.places:places:4.3.1"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.room:room-runtime:2.6.1"
    annotationProcessor "androidx.room:room-compiler:2.6.1"
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
